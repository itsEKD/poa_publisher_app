{% extends "admin/dashboard.html" %}
{% block main %}

<div class="container my-5">
  <div class="card shadow rounded-4">
    <div class="card-body p-4">
      <h3 class="card-title text-center mb-4">📝 Give Feedback for "{{ book.title }}"</h3>

      <form method="POST">
        <div class="mb-3">
          <label for="feedback" class="form-label">Feedback Message</label>
          <textarea class="form-control" id="feedback" name="feedback" rows="5"
                    placeholder="Write your comments or required changes here..." required>{{ book.feedback or '' }}</textarea>
        </div>

        <div class="d-flex justify-content-between">
          <a href="{{ url_for('admin.unapproved_books') }}" class="btn btn-secondary">⬅ Back</a>
          <button type="submit" class="btn btn-primary">Submit Feedback</button>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
