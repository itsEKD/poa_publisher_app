{% extends "admin/dashboard.html" %}
{% block main %}

<!-- Bootstrap CSS (remove if already included in dashboard.html) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container my-5">
  <div class="card shadow-lg rounded-4">
    <div class="card-body p-4">
      <h2 class="card-title text-center mb-4">📘 Upload New Book</h2>

      <form method="POST" enctype="multipart/form-data">

        <div class="row g-3">
          <div class="col-md-6">
            <label for="title" class="form-label">Book Title</label>
            <input type="text" class="form-control" id="title" name="title" required>
          </div>

          <div class="col-md-6">
            <label for="author" class="form-label">Author</label>
            <input type="text" class="form-control" id="author" name="author" required>
          </div>
        </div>

        <div class="mt-3">
          <label for="description" class="form-label">Description</label>
          <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
        </div>

        <div class="row g-3 mt-1">
          <div class="col-md-6">
            <label for="category" class="form-label">Category</label>
            <input type="text" class="form-control" id="category" name="category" required>
          </div>

          <div class="col-md-3">
            <label for="price" class="form-label">Price ($)</label>
            <input type="number" class="form-control" id="price" name="price" step="0.01" required>
          </div>

          <div class="col-md-3 d-flex align-items-end">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="is_free" name="is_free">
              <label class="form-check-label" for="is_free">Free Book</label>
            </div>
          </div>
        </div>

        <div class="mt-3">
          <label for="tags" class="form-label">Tags (comma-separated)</label>
          <input type="text" class="form-control" id="tags" name="tags" placeholder="e.g. writing,fiction,career">
        </div>

        <div class="mt-4">
          <label for="pdf_file" class="form-label">Upload PDF</label>
          <input type="file" class="form-control" id="pdf_file" name="pdf_file" accept="application/pdf" required>
        </div>

        <div class="mt-3">
          <label for="cover_image" class="form-label">Cover Image (optional)</label>
          <input type="file" class="form-control" id="cover_image" name="cover_image" accept="image/*" onchange="previewCover(event)">
        </div>

        <div class="text-center mt-3">
          <img id="cover_preview" alt="Cover Preview"
               style="max-height: 200px; display: none; border-radius: 8px;"
               class="img-fluid shadow-sm mt-2" />
        </div>

        <div class="mt-4 d-grid">
          <button type="submit" class="btn btn-primary">Upload Book</button>
        </div>

      </form>
    </div>
  </div>
</div>

<!-- Bootstrap JS Bundle (remove if already included in dashboard.html) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Cover preview script -->
<script>
  function previewCover(event) {
    const input = event.target;
    const preview = document.getElementById('cover_preview');
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function (e) {
        preview.src = e.target.result;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(input.files[0]);
    } else {
      preview.style.display = 'none';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('cover_image').value = "";
    document.getElementById('cover_preview').style.display = 'none';
  });


  // Preview cover (existing script)
  function previewCover(event) {
    const input = event.target;
    const preview = document.getElementById('cover_preview');
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function (e) {
        preview.src = e.target.result;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(input.files[0]);
    } else {
      preview.style.display = 'none';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('cover_image').value = "";
    document.getElementById('cover_preview').style.display = 'none';

    const isFreeCheckbox = document.getElementById('is_free');
    const priceInput = document.getElementById('price');

    function togglePriceRequirement() {
      if (isFreeCheckbox.checked) {
        priceInput.required = false;
        priceInput.disabled = true;
        priceInput.value = '';
      } else {
        priceInput.required = true;
        priceInput.disabled = false;
      }
    }

    // Initialize state on load
    togglePriceRequirement();

    // Update on change
    isFreeCheckbox.addEventListener('change', togglePriceRequirement);
  });


</script>

{% endblock %}
