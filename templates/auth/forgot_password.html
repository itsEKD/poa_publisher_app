{% extends "base.html" %}
{% block title %}Forgot Password - POA Publishers{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 40px auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px; background-color: #f9f9f9;">
    <h2 style="text-align: center;">🔑 Forgot Password</h2>
    <form method="POST" style="display: flex; flex-direction: column; gap: 15px;">
        <div>
            <label for="email">📧 Enter your email address:</label><br>
            <input type="email" id="email" name="email" required style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
        </div>
        <button type="submit" style="padding: 10px; background-color: #007BFF; color: white; border: none; border-radius: 5px; cursor: pointer;">
            Send Reset Instructions
        </button>
        <p style="text-align: center; margin-top: 10px;">
            Remembered your password? <a href="{{ url_for('auth.login') }}">Login here</a>
        </p>
    </form>
</div>
{% endblock %}
