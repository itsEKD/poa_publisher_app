{% extends "base.html" %}

{% block title %}Login - POA Publishers{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card mx-auto shadow-sm" style="max-width: 450px;">
        <div class="card-body">
            <h3 class="card-title text-center mb-4">🔐 Login</h3>
            <form method="POST" action="{{ url_for('auth.login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label for="email" class="form-label">📧 Email</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">🔒 Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="remember" name="remember">
                    <label class="form-check-label" for="remember">Remember Me</label>
                </div>

                <div class="mb-3 text-end">
                    <a href="{{ url_for('auth.forgot_password') }}" class="text-decoration-none" style="font-size: 0.9em;">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-success w-100">Login</button>

                <div class="text-center mt-3">
                    <p>Don't have an account? 
                        <a href="{{ url_for('auth.register') }}">Register Now</a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
