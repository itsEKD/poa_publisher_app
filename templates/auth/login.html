{% extends "base.html" %}

{% block title %}Login - POA Publishers{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 40px auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); background-color: #f9f9f9;">
    <h2 style="text-align: center;">🔐 Login</h2>
    <form method="POST" style="display: flex; flex-direction: column; gap: 15px;">
        <div>
            <label for="email">📧 Email:</label><br>
            <input type="email" id="email" name="email" required style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
        </div>
        <div>
            <label for="password">🔒 Password:</label><br>
            <input type="password" id="password" name="password" required style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
        </div>
        <button type="submit" style="padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer;">
            Login
        </button>
        <p style="text-align: center; margin-top: 10px;">
            Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>
        </p>
    </form>
</div>
{% endblock %}
