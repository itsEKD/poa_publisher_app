{# templates/author/upload.html #}
{% extends "author/dashboard.html" %}
{% block main %}

<div class="container my-5">
  <div class="card shadow-lg rounded-4">
    <div class="card-body p-4">
      <h2 class="card-title text-center mb-4">
        {{ '✏️ Edit Book' if editing else '📘 Upload New Book' }}
      </h2>

      <form method="POST" enctype="multipart/form-data" action="{{ form_action }}">

        <div class="row g-3">
          <div class="col-md-6">
            <label for="title" class="form-label">Book Title</label>
            <input type="text" class="form-control" id="title" name="title"
                   value="{{ book.title if book else '' }}" required>
          </div>

          <div class="col-md-6">
            <label for="author" class="form-label">Author</label>
            <input type="text" class="form-control" id="author" name="author"
                   value="{{ book.author if book else '' }}" required>
          </div>
        </div>

        <div class="mt-3">
          <label for="description" class="form-label">Description</label>
          <textarea class="form-control" id="description" name="description" rows="3" required>{{ book.description if book else '' }}</textarea>
        </div>

        <div class="row g-3 mt-1">
          <div class="col-md-6">
            <label for="category" class="form-label">Category</label>
            <input type="text" class="form-control" id="category" name="category"
                   value="{{ book.category if book else '' }}" required>
          </div>

          <div class="col-md-3">
            <label for="price" class="form-label">Price ($)</label>
            <input type="number" class="form-control" id="price" name="price" step="0.01"
                   value="{{ book.price if book and not book.is_free else '' }}">
          </div>

          <div class="col-md-3 d-flex align-items-end">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="is_free" name="is_free"
                     {% if book and book.is_free %}checked{% endif %}>
              <label class="form-check-label" for="is_free">Free Book</label>
            </div>
          </div>
        </div>

        <div class="mt-3">
          <label for="tags" class="form-label">Tags (comma-separated)</label>
          <input type="text" class="form-control" id="tags" name="tags"
                 value="{{ book.tags | join(', ') if book and book.tags else '' }}">
        </div>

        <div class="mt-4">
          <label for="pdf_file" class="form-label">Upload PDF {{ '(leave blank to keep existing)' if editing else '' }}</label>
          <input type="file" class="form-control" id="pdf_file" name="pdf_file" accept="application/pdf" {% if not editing %}required{% endif %}>
        </div>

        <div class="mt-3">
          <label for="cover_image" class="form-label">Cover Image (optional)</label>
          <input type="file" class="form-control" id="cover_image" name="cover_image" accept="image/*" onchange="previewCover(event)">
        </div>

        {% if book and book.cover_image %}
        <div class="text-center mt-3">
          <p class="text-muted mb-1">Current Cover:</p>
          <img src="{{ url_for('static', filename='uploads/book_covers/' ~ book.cover_image) }}"
               alt="Current Cover" style="max-height: 200px;" class="img-fluid rounded shadow-sm">
        </div>
        {% endif %}

        <div class="text-center mt-3">
          <img id="cover_preview" alt="Cover Preview"
               style="max-height: 200px; display: none; border-radius: 8px;"
               class="img-fluid shadow-sm mt-2" />
        </div>

        <div class="mt-4 d-grid">
          <button type="submit" class="btn btn-primary">{{ 'Update Book' if editing else 'Upload Book' }}</button>
        </div>

      </form>
    </div>
  </div>
</div>

<script>
  function previewCover(event) {
    const input = event.target;
    const preview = document.getElementById('cover_preview');
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function (e) {
        preview.src = e.target.result;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(input.files[0]);
    } else {
      preview.style.display = 'none';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('cover_image').value = "";
    document.getElementById('cover_preview').style.display = 'none';

    const isFreeCheckbox = document.getElementById('is_free');
    const priceInput = document.getElementById('price');

    function togglePriceRequirement() {
      if (isFreeCheckbox.checked) {
        priceInput.required = false;
        priceInput.disabled = true;
        priceInput.value = '';
      } else {
        priceInput.required = true;
        priceInput.disabled = false;
      }
    }

    togglePriceRequirement();
    isFreeCheckbox.addEventListener('change', togglePriceRequirement);
  });
</script>

{% endblock %}
