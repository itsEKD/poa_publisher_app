{% extends "base.html" %}
{% block title %}Write a Blog - POA Publishers{% endblock %}

{% block content %}
<h2>📝 Create a Blog Post</h2>

<form method="POST" action="{{ url_for('blog.create') }}">

    
    <div>
        <label>Title:</label>
        <input type="text" name="title" required style="width: 100%; padding: 8px;">
    </div>

    <div>
        <label>Category:</label>
        <select name="category" required style="width: 100%; padding: 8px;">
            <option value="">-- Choose Category --</option>
            <option value="authorship">Authorship</option>
            <option value="mentorship">Mentorship</option>
            <option value="scholarships">Scholarships</option>
            <option value="projects">Projects</option>
        </select>
    </div>

    <div>
        <label>Content:</label>
        <textarea name="content" rows="8" required style="width: 100%; padding: 8px;"></textarea>
    </div>

    <button type="submit" style="margin-top: 10px;">📤 Publish</button>
</form>
{% endblock %}
