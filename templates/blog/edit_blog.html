{% extends "base.html" %}
{% block title %}Edit Blog - POA Publishers{% endblock %}

{% block content %}
<div class="container mt-5">
  <h2 class="mb-4 text-primary">Edit Blog Post</h2>
  <form action="{{ url_for('blog.edit', blog_id=blog._id) }}" method="POST" enctype="multipart/form-data">
    <div class="mb-3">
      <label class="form-label">Title</label>
      <input type="text" name="title" class="form-control" value="{{ blog.title }}" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Category</label>
      <input type="text" name="category" class="form-control" value="{{ blog.category }}" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Summary</label>
      <textarea name="summary" class="form-control" rows="2">{{ blog.summary }}</textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Tags (comma-separated)</label>
      <input type="text" name="tags" class="form-control" value="{{ blog.tags | join(', ') }}">
    </div>

    <div class="mb-3">
      <label class="form-label">Content</label>
      <textarea name="content" class="form-control" id="editor" rows="10" required>{{ blog.content }}</textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Current Cover Image:</label><br>
      {% if blog.cover_image %}
        <img src="{{ url_for('static', filename='uploads/blog_covers/' + blog.cover_image) }}" alt="Cover" class="img-thumbnail" width="200">
      {% else %}
        <p class="text-muted">No cover image uploaded.</p>
      {% endif %}
    </div>

    <!-- Optional: Add option to upload a new cover -->
    <!--
    <div class="mb-3">
      <label class="form-label">Replace Cover Image</label>
      <input type="file" name="cover_image" class="form-control">
    </div>
    -->
    <button type="submit" name="action" value="preview" class="btn btn-secondary">Preview</button>
    <button type="submit" class="btn btn-success">Update Blog</button>
    <a href="{{ url_for('blog.view_blogs') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>

<!-- Optional: Quill/CKEditor Integration -->
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script>
  var quill = new Quill('#editor', {
    theme: 'snow'
  });

  document.querySelector('form').addEventListener('submit', function () {
    var content = document.querySelector('textarea[name=content]');
    content.value = quill.root.innerHTML;
  });

  // Set initial content
  quill.root.innerHTML = {{ blog.content | tojson | safe }};
</script>
{% endblock %}
